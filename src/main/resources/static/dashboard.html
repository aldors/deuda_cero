<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deuda Cero</title>

    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">

    <script src="./javascript/tema.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Dosis:wght@200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/tema.css">
</head>

<body>

    <div class="app">

        <!-- BARRA LATERAL -->
        <aside class="sidebar" id="sidebar">

            <div class="logo">
                <span class="logo-icon">$</span>
                <span>Deuda Cero</span>
            </div>

            <nav class="navigation">

                <a href="#inicio" class="nav-item active">
                    <span class="nav-icon">⌂</span>
                    <span>Inicio</span>
                </a>

                <a href="#groupsSection" class="nav-item">
                    <span class="nav-icon">▣</span>
                    <span>Mis grupos</span>
                </a>

                <a href="#invitationsSection" class="nav-item">
                    <span class="nav-icon">✉</span>
                    <span>Invitaciones</span>
                    <span class="notification-badge hidden"></span>
                </a>

            </nav>

            <div class="sidebar-bottom">

                <button id="logoutBtn" class="logout-button">
                    <span class="nav-icon">↪</span>
                    <span>Cerrar sesión</span>
                </button>

            </div>

        </aside>

        <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>


        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">

            <!-- HEADER -->
            <header class="topbar" id="inicio">

                <button
                    id="menuToggle"
                    class="menu-toggle"
                    aria-label="Abrir menú"
                    aria-controls="sidebar"
                    aria-expanded="false"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <div class="welcome">
                    <span class="welcome-label">Bienvenido de nuevo</span>
                    <h1 id="userName">Cargando...</h1>
                </div>

                <div class="user-info">

                    <button
                        type="button"
                        class="theme-toggle"
                        data-theme-toggle
                        aria-label="Modo oscuro"
                        aria-pressed="false"
                        title="Activar modo oscuro"
                    >
                        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>

                        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                        </svg>
                    </button>

                    <div class="user-avatar" id="userAvatar">
                        ?
                    </div>

                    <div class="user-data">
                        <span id="userNameHeader">Usuario</span>
                        <span id="userEmail">correo@ejemplo.com</span>
                    </div>
                </div>

            </header>


            <!-- CONTENIDO -->
            <section class="content">

                <!-- ENCABEZADO DE GRUPOS -->
                <div class="section-header" id="groupsSection">

                    <div>
                        <span class="section-label">ESPACIOS COMPARTIDOS</span>
                        <h2>Mis grupos</h2>
                    </div>

                    <button id="createGroupBtn" class="primary-button">
                        <span>+</span>
                        Crear grupo
                    </button>

                </div>


                <!-- GRUPOS -->
                <div id="groupsContainer" class="groups-grid">

                    <!--
                        Los grupos reales se cargarán aquí
                        mediante JavaScript.
                    -->

                    <div class="empty-state" id="groupsLoading">
                        <div class="loading-spinner"></div>
                        <p>Cargando tus grupos...</p>
                    </div>

                </div>


                <!-- INVITACIONES -->
                <div class="section-header invitations-header" id="invitationsSection">

                    <div>
                        <span class="section-label">PENDIENTES</span>
                        <h2>Invitaciones</h2>
                    </div>

                </div>


                <div id="invitationsContainer" class="invitations-container">

                    <div class="empty-state">
                        <div class="empty-icon">✉</div>
                        <p>Cargando invitaciones...</p>
                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- MODAL CREAR GRUPO -->
    <div id="createGroupModal" class="modal-overlay hidden">

        <div class="modal">

            <div class="modal-header">
                <div>
                    <span class="section-label">NUEVO ESPACIO</span>
                    <h2>Crear grupo</h2>
                </div>

                <button id="closeModalBtn" class="close-button">
                    ×
                </button>
            </div>


            <form id="createGroupForm">

                <div class="form-group">

                    <label for="groupName">
                        Nombre del grupo
                    </label>

                    <input
                        type="text"
                        id="groupName"
                        name="nombre"
                        placeholder="Ej. Viaje a Cancún"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="groupDescription">
                        Descripción
                        <span>(opcional)</span>
                    </label>

                    <textarea
                        id="groupDescription"
                        name="descripcion"
                        placeholder="¿Para qué utilizarán este grupo?"
                        maxlength="255"
                        rows="4"
                    ></textarea>

                </div>


                <div id="createGroupError" class="form-error hidden">
                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelModalBtn"
                        class="secondary-button"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Crear grupo
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="./javascript/api.js"></script>
    <script src="./javascript/dashboard.js"></script>

</body>
</html>
