spring.application.name=deuda_cero

# Conexion bdd
spring.datasource.url=jdbc:mysql://localhost:3306/NOMBRE_BDD
spring.datasource.username=TU_USER
spring.datasource.password=TU_PASSWORD

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de tokens y secret key
jwt.secret=TU_JWT_SECRET
jwt.expirationAccessToken= 1800000
jwt.expirationRefreshToken=3600000

# 1 hora: 3600000
# 30 minutos: 1800000
# 5 minutos: 300000
# 2 minutos: 120000
# 1 minutos: 60000