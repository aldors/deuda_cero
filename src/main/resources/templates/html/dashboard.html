<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deuda Cero</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Dosis:wght@200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

    <div class="app">

        <!-- BARRA LATERAL -->
        <aside class="sidebar">

            <div class="logo">
                <span class="logo-icon">$</span>
                <span>Deuda Cero</span>
            </div>

            <nav class="navigation">

                <a href="dashboard.html" class="nav-item active">
                    <span class="nav-icon">⌂</span>
                    <span>Inicio</span>
                </a>

                <a href="#" class="nav-item">
                    <span class="nav-icon">▣</span>
                    <span>Mis grupos</span>
                </a>

                <a href="#" class="nav-item">
                    <span class="nav-icon">✉</span>
                    <span>Invitaciones</span>
                    <span class="notification-badge hidden"></span>
                </a>

            </nav>

            <div class="sidebar-bottom">

                <button id="logoutBtn" class="logout-button">
                    <span class="nav-icon">↪</span>
                    <span>Cerrar sesión</span>
                </button>

            </div>

        </aside>


        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">

            <!-- HEADER -->
            <header class="topbar">

                <div class="welcome">
                    <span class="welcome-label">Bienvenido de nuevo</span>
                    <h1 id="userName">Cargando...</h1>
                </div>

                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">
                        ?
                    </div>

                    <div class="user-data">
                        <span id="userNameHeader">Usuario</span>
                        <span id="userEmail">correo@ejemplo.com</span>
                    </div>
                </div>

            </header>


            <!-- CONTENIDO -->
            <section class="content">

                <!-- ENCABEZADO DE GRUPOS -->
                <div class="section-header">

                    <div>
                        <span class="section-label">ESPACIOS COMPARTIDOS</span>
                        <h2>Mis grupos</h2>
                    </div>

                    <button id="createGroupBtn" class="primary-button">
                        <span>+</span>
                        Crear grupo
                    </button>

                </div>


                <!-- GRUPOS -->
                <div id="groupsContainer" class="groups-grid">

                    <!--
                        Los grupos reales se cargarán aquí
                        mediante JavaScript.
                    -->

                    <div class="empty-state" id="groupsLoading">
                        <div class="loading-spinner"></div>
                        <p>Cargando tus grupos...</p>
                    </div>

                </div>


                <!-- INVITACIONES -->
                <div class="section-header invitations-header">

                    <div>
                        <span class="section-label">PENDIENTES</span>
                        <h2>Invitaciones</h2>
                    </div>

                </div>


                <div id="invitationsContainer" class="invitations-container">

                    <div class="empty-state">
                        <div class="empty-icon">✉</div>
                        <p>Cargando invitaciones...</p>
                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- MODAL CREAR GRUPO -->
    <div id="createGroupModal" class="modal-overlay hidden">

        <div class="modal">

            <div class="modal-header">
                <div>
                    <span class="section-label">NUEVO ESPACIO</span>
                    <h2>Crear grupo</h2>
                </div>

                <button id="closeModalBtn" class="close-button">
                    ×
                </button>
            </div>


            <form id="createGroupForm">

                <div class="form-group">

                    <label for="groupName">
                        Nombre del grupo
                    </label>

                    <input
                        type="text"
                        id="groupName"
                        name="nombre"
                        placeholder="Ej. Viaje a Cancún"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="groupDescription">
                        Descripción
                        <span>(opcional)</span>
                    </label>

                    <textarea
                        id="groupDescription"
                        name="descripcion"
                        placeholder="¿Para qué utilizarán este grupo?"
                        maxlength="255"
                        rows="4"
                    ></textarea>

                </div>


                <div id="createGroupError" class="form-error hidden">
                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelModalBtn"
                        class="secondary-button"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Crear grupo
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="../javascript/api.js"></script>
    <script src="../javascript/dashboard.js"></script>

</body>
</html>
